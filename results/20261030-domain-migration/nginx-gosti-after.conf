limit_req_zone $binary_remote_addr zone=tangerin_csp:1m rate=5r/m;
map $http_x_forwarded_proto $gosti_https { default off; https on; }

server {
    listen 127.0.0.1:8108;
    server_name localhost;
    root /var/www/gosti/current/cms/public;
    index index.php;
    client_max_body_size 20m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param HTTPS $gosti_https;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ /\. { deny all; }
}

