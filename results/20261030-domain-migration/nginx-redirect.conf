# Migration 2026-10-30: keep old-domain redirects permanently.
server {
    listen 80;
    listen [::]:80;
    server_name gostevoidom44.ru www.gostevoidom44.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location = / { return 301 https://tangerin.ru/$is_args$args; }
    location = /page26164900.html { return 301 https://tangerin.ru/$is_args$args; }
    location = /page26590216.html { return 410; }
    location = /sitemap.xml { return 301 https://tangerin.ru/sitemap.xml; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tangerin.ru/sitemap.xml\n";
    }
    location / { return 404; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gostevoidom44.ru www.gostevoidom44.ru;
    ssl_certificate /etc/letsencrypt/live/gostevoidom44.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gostevoidom44.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    location = / { return 301 https://tangerin.ru/$is_args$args; }
    location = /page26164900.html { return 301 https://tangerin.ru/$is_args$args; }
    location = /page26590216.html { return 410; }
    location = /sitemap.xml { return 301 https://tangerin.ru/sitemap.xml; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tangerin.ru/sitemap.xml\n";
    }
    location / { return 404; }
}
